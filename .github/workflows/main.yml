name: Build Kernel from dotConfig

# 工作流触发条件
on:
  workflow_dispatch:
  push:
    branches:
      - shockwave-stable-ss

# 全局环境变量
env:
  ARCH: arm64
  SUBARCH: arm64
  KBUILD_BUILD_USER: "xiaozhao45"
  KBUILD_BUILD_HOST: "GitHub-Actions"

jobs:
  build_kernel:
    name: Build with custom dotConfig
    runs-on: ubuntu-latest

    steps:
      # 步骤 1: 检出源代码
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 步骤 2: 安装编译依赖
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          build-essential bc bison flex git zip \
          kmod cpio libssl-dev libelf-dev rsync

      # ========================================================================= #
      #                             这里是核心修复之处                            #
      # ========================================================================= #
      # 步骤 3.1: 缓存 Proton-Clang 工具链
      - name: Cache Proton-Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang-llvm
          # 使用新的 key 来避免使用旧的、有问题的缓存
          key: toolchain-${{ runner.os }}-proton-clang

      # 步骤 3.2: 下载 Proton-Clang (一个工具链就够了)
      - name: Download Proton-Clang Toolchain
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang-llvm

      # 步骤 4: 设置编译环境变量 (现在更简单了)
      - name: Set up build environment
        run: |
          # Proton-Clang 包含了所有工具，只需要添加它自己的 bin 目录
          echo "PATH=${{ github.workspace }}/clang-llvm/bin:${PATH}" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
          # 即使我们不用 GCC 编译，内核脚本仍需要这个变量来找到链接器等工具
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV

      # 步骤 5: 准备内核配置文件
      - name: Prepare Kernel Config from dotConfig.txt
        run: |
          make O=out mrproper
          cp dotConfig.txt out/.config

      # 步骤 6: 编译内核
      - name: Build Kernel
        run: |
          make -j$(nproc) O=out \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip

      # 步骤 7: 打包构建产物
      - name: Package build artifacts
        run: |
          FINAL_KERNEL_IMAGE="Image.gz-dtb"
          mkdir -p ${{ github.workspace }}/artifacts
          if [ -f "${{ github.workspace }}/out/arch/${{ env.ARCH }}/boot/${FINAL_KERNEL_IMAGE}" ]; then
            cp "${{ github.workspace }}/out/arch/${{ env.ARCH }}/boot/${FINAL_KERNEL_IMAGE}" "${{ github.workspace }}/artifacts/"
            echo "Kernel image '${FINAL_KERNEL_IMAGE}' found and copied."
          else
            echo "Error: Kernel image '${FINAL_KERNEL_IMAGE}' not found!"
            echo "Listing available files in boot directory for debugging:"
            ls -R ${{ github.workspace }}/out/arch/${{ env.ARCH }}/boot/
            exit 1
          fi
          cp ${{ github.workspace }}/out/.config ${{ github.workspace }}/artifacts/config_used_for_build.txt

      # 步骤 8: 上传构建产物
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-${{ github.run_number }}
          path: ${{ github.workspace }}/artifacts/

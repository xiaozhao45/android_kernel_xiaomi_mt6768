name: Build Kernel from dotConfig

# 工作流触发条件
on:
  workflow_dispatch:
  push:
    branches:
      - shockwave-stable-ss

# 全局环境变量
env:
  ARCH: arm64
  SUBARCH: arm64
  KBUILD_BUILD_USER: "xiaozhao45"
  KBUILD_BUILD_HOST: "GitHub-Actions"

jobs:
  build_kernel:
    name: Build with custom dotConfig
    runs-on: ubuntu-latest

    steps:
      # 步骤 1: 检出源代码
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 步骤 2: 安装编译依赖
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          build-essential bc bison flex git zip \
          kmod cpio libssl-dev libelf-dev rsync wget tar xz-utils

      # 步骤 3.1: 缓存 Proton-Clang 工具链
      - name: Cache Proton-Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang-llvm
          key: toolchain-${{ runner.os }}-proton-clang

      # 步骤 3.2: 下载 Proton-Clang
      - name: Download Proton-Clang Toolchain
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang-llvm

      # ========================================================================= #
      #                   这里是针对根本原因的最终修复之处                        #
      # ========================================================================= #
      # 步骤 4: 安装 Zig 工具链 (用于编译主机工具)
      - name: Install Zig Toolchain
        run: |
          # 下载特定版本的 Zig, 以保证稳定性
          wget https://ziglang.org/download/0.11.0/zig-linux-x86_64-0.11.0.tar.xz
          tar -xf zig-linux-x86_64-0.11.0.tar.xz
          
          # 定义 Zig 的解压路径
          ZIG_DIR="${{ github.workspace }}/zig-linux-x86_64-0.11.0"
          
          # 修复: 立即更新当前 shell 的 PATH, 这样本步骤中的命令就能找到 zig
          export PATH="$ZIG_DIR:$PATH"
          
          # 同时将 Zig 的路径添加到 GITHUB_PATH, 以便后续所有步骤也能找到 zig
          echo "$ZIG_DIR" >> $GITHUB_PATH
          
          # 验证安装，现在这条命令可以成功执行了
          zig version

      # 步骤 5: 准备内核配置文件
      - name: Prepare Kernel Config
        run: |
          make O=out mrproper
          cp dotConfig.txt out/.config

      # 步骤 6: 编译内核 (使用 Zig 构建主机工具, Clang 构建内核)
      - name: Build Kernel
        run: |
          # 仅导出编译脚本需要的环境变量
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export CROSS_COMPILE="aarch64-linux-gnu-"
          
          # 执行编译
          # HOSTCC="zig cc" -> 使用 Zig 作为主机 C 编译器来构建 scripts/ 等工具
          # CC, LD 等 -> 仍然使用 Clang/LLVM 工具链来交叉编译内核本身
          make -j2 O=out \
            CC="${{ github.workspace }}/clang-llvm/bin/clang" \
            HOSTCC="zig cc" \
            LD="${{ github.workspace }}/clang-llvm/bin/ld.lld" \
            AR="${{ github.workspace }}/clang-llvm/bin/llvm-ar" \
            NM="${{ github.workspace }}/clang-llvm/bin/llvm-nm" \
            OBJCOPY="${{ github.workspace }}/clang-llvm/bin/llvm-objcopy" \
            OBJDUMP="${{ github.workspace }}/clang-llvm/bin/llvm-objdump" \
            STRIP="${{ github.workspace }}/clang-llvm/bin/llvm-strip"

      # 步骤 7: 打包构建产物
      - name: Package build artifacts
        run: |
          FINAL_KERNEL_IMAGE="Image.gz-dtb"
          mkdir -p ${{ github.workspace }}/artifacts
          if [ -f "${{ github.workspace }}/out/arch/${{ env.ARCH }}/boot/${FINAL_KERNEL_IMAGE}" ]; then
            cp "${{ github.workspace }}/out/arch/${{ env.ARCH }}/boot/${FINAL_KERNEL_IMAGE}" "${{ github.workspace }}/artifacts/"
            echo "Kernel image '${FINAL_KERNEL_IMAGE}' found and copied."
          else
            echo "Error: Kernel image '${FINAL_KERNEL_IMAGE}' not found!"
            echo "Listing available files in boot directory for debugging:"
            ls -R ${{ github.workspace }}/out/arch/${{ env.ARCH }}/boot/
            exit 1
          fi
          cp ${{ github.workspace }}/out/.config ${{ github.workspace }}/artifacts/config_used_for_build.txt

      # 步骤 8: 上传构建产物
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-${{ github.run_number }}
          path: ${{ github.workspace }}/artifacts/
